spring:
  application:
    name: mini-oms
  datasource:
    url: jdbc:postgresql://localhost:5432/minioms
    username: minioms
    password: minioms_local   # ローカル開発専用。本番想定の値は環境変数で注入する方針
  jpa:
    hibernate:
      ddl-auto: validate   # スキーマ管理はFlywayに一本化。JPAには検証のみさせる
    open-in-view: false    # OSIVはN+1の温床になるため最初から無効化

  profiles:
    # モールAPIのモックを同居させたローカル開発用の既定。本番相当の構成では外す
    active: mock

minioms:
  mall:
    # モックは同一プロセス内で動くため自分自身を指す。実モール接続時はここだけ差し替える
    mall-a-base-url: http://localhost:${server.port:8080}/mock/mall-a
    mall-b-base-url: http://localhost:${server.port:8080}/mock/mall-b
  import:
    # 取りこぼしを防ぐため、実行間隔より長い期間を遡って取得する。
    # 重複は冪等キーで弾かれるので、重ねる方が安全
    interval: PT1M
    lookback: PT1H
  security:
    jwt:
      # 署名鍵。未設定なら起動ごとにランダム生成する(再起動で既存トークンは無効になる)。
      # 本番相当の構成では MINIOMS_SECURITY_JWT_SECRET で必ず注入する。
      # Why not: 既定値をここに書かない。公開リポジトリに鍵が残ると、
      # そのビルドで発行されたトークンを誰でも偽造できる
      secret: ${MINIOMS_SECURITY_JWT_SECRET:}
      # 失効リストを持たない代わりに寿命を短くする。
      # ログアウトしても最大この時間はトークンが有効、という割り切りを設定として明示する
      ttl: PT1H
